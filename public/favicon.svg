<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background Container for high visibility in dark/light browser tabs -->
  <rect width="64" height="64" rx="16" fill="#1c1917"/>
  <!-- Antenna -->
  <rect x="22" y="6" width="5" height="18" rx="2.5" fill="#a8a29e"/>
  <!-- Volume Knob -->
  <rect x="38" y="10" width="7" height="8" rx="2" fill="#d97706"/>
  <!-- Radio Main Body -->
  <rect x="16" y="18" width="32" height="40" rx="7" fill="url(#bodyGrad)" stroke="#57534e" stroke-width="1.5"/>
  <!-- Amber Screen / Channel Display -->
  <rect x="22" y="24" width="20" height="9" rx="2.5" fill="url(#amberGrad)"/>
  <rect x="24" y="26" width="16" height="5" rx="1" fill="#1c1917" opacity="0.3"/>
  <text x="32" y="30.5" font-family="system-ui, sans-serif" font-size="4" font-weight="bold" fill="#ffffff" text-anchor="middle">RA-01</text>
  <!-- Speaker Grille Lines -->
  <line x1="22" y1="38" x2="42" y2="38" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="43" x2="42" y2="43" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="48" x2="39" y2="48" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>
  <!-- LED Status Indicator (Green) -->
  <circle cx="43" cy="22" r="1.5" fill="#22c55e"/>
  <!-- PTT Side Button Accent -->
  <rect x="13.5" y="26" width="3" height="12" rx="1.5" fill="#d97706"/>
</svg>
